name: macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Nota.app
        run: ./scripts/bundle-macos.sh
      - name: Make DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/Nota.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Nota -srcfolder dist/dmg -ov -format UDZO dist/Nota-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Nota-macos-arm64
          path: dist/Nota-macos-arm64.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nota-macos-arm64.dmg
          body: |
            Nota for macOS (Apple Silicon).

            The app is not notarized. After dragging it into Applications, open it once with right-click → Open,
            or run: `xattr -dr com.apple.quarantine /Applications/Nota.app`
